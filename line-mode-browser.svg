<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Illustration of a text-only browser showing numbered link references</title>
  <rect width="600" height="450" fill="#0B0D0E"/>
  <polygon points="420,0 600,0 600,450 240,450" fill="#D7FF00"/>
  <g transform="translate(60 70)">
    <rect width="440" height="310" rx="8" fill="#24282B" stroke="#F4F5F0" stroke-width="2"/>
    <rect width="440" height="34" rx="8" fill="#A7ADB2"/>
    <rect y="20" width="440" height="14" fill="#A7ADB2"/>
    <g fill="#0B0D0E"><circle cx="20" cy="17" r="6"/><circle cx="40" cy="17" r="6"/><circle cx="60" cy="17" r="6"/></g>
    <g font-family="Courier New, Courier, monospace" font-size="17" fill="#F4F5F0">
      <text x="24" y="76">World Wide Web</text>
      <text x="24" y="118">The WorldWideWeb (W3) is a</text>
      <text x="24" y="142">wide-area hypermedia<tspan fill="#D7FF00">[1]</tspan></text>
      <text x="24" y="166">information retrieval</text>
      <text x="24" y="190">initiative...</text>
      <text x="24" y="232">Help<tspan fill="#D7FF00">[2]</tspan>  History<tspan fill="#D7FF00">[3]</tspan></text>
      <text x="24" y="282" fill="#A7ADB2">&lt;RETURN&gt; for more, Quit, or Help:</text>
    </g>
    <rect x="362" y="268" width="10" height="18" fill="#D7FF00"/>
  </g>
</svg>
